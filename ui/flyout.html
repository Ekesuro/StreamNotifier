<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick view</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: auto; background: var(--surface); overflow: hidden; }
  #wrap { border: 1px solid var(--border); min-height: 100vh; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; gap: 9px; padding: 13px 14px 9px; }
  .head b { font-size: 14px; font-weight: 650; }
  .head .count { margin-left: auto; font-size: 12px; color: var(--muted); }
  .list { padding: 0 6px 6px; max-height: 560px; overflow-y: auto; }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  .item:hover { background: var(--surface-2); }
  .item .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
  .item.live .name { font-weight: 600; }
  .item:not(.live) .name { color: var(--muted); }
  .item .meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex: none; }
  .item .viewers { color: var(--text); font-weight: 600; }
  .item .plat { font-size: 10.5px; opacity: .9; }
  .muted-bell { color: var(--muted); opacity: .6; }
  .muted-bell svg { width: 13px; height: 13px; }
  .empty { padding: 14px; color: var(--muted); font-size: 13px; text-align: center; }
  .foot {
    display: flex; gap: 4px; padding: 8px; border-top: 1px solid var(--border); background: var(--bg); margin-top: auto;
  }
  .foot button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px; border: 0;
    border-radius: 8px; background: none; cursor: pointer; color: var(--muted); font-size: 11.5px;
  }
  .foot button:hover { background: var(--surface-2); color: var(--text); }
  .foot button.quit:hover { color: var(--danger); }
  .spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="wrap">
  <div class="head"><span class="dot" id="headDot"></span><b>Stream Notifier</b><span class="count" id="count"></span></div>
  <div class="list" id="list"></div>
  <div class="foot">
    <button id="openBtn"></button>
    <button id="refreshBtn"></button>
    <button id="settingsBtn"></button>
    <button id="quitBtn" class="quit"></button>
  </div>
</div>
<script src="common.js"></script>
<script>
const $ = s => document.querySelector(s);
const api = () => window.pywebview.api;
let state = { streamers: [] };

$("#openBtn").innerHTML = icon("window") + "Open app";
$("#refreshBtn").innerHTML = icon("refresh") + "Refresh";
$("#settingsBtn").innerHTML = icon("gear") + "Settings";
$("#quitBtn").innerHTML = icon("power") + "Quit";

function render() {
  const list = sortStreamers(state.streamers);
  const live = list.filter(s => s.state === "live").length;
  $("#headDot").className = "dot " + (live ? "live" : "");
  $("#count").textContent = list.length ? `${live} of ${list.length} live` : "";
  $("#list").innerHTML = list.length ? list.map(s => {
    const isLive = s.state === "live";
    const dot = isLive ? "live" : s.state === "offline" ? "" : "unknown";
    return `<div class="item ${isLive ? "live" : ""}" data-p="${esc(s.platform)}" data-n="${esc(s.name)}"
                 title="${esc(isLive ? (s.title || "") : s.state === "offline" ? "Offline" : (s.error || s.state))}">
      <span class="dot ${dot}"></span>
      <span class="name">${esc(s.display || s.name)}</span>
      <span class="meta">
        ${s.notify ? "" : `<span class="muted-bell" title="Notifications muted">${icon("bellOff")}</span>`}
        ${isLive ? `<span class="viewers">${fmtViewers(s.viewers)}</span>` : ""}
        <span class="plat ${s.platform}">${PLATFORM[s.platform]}</span>
      </span>
    </div>`;
  }).join("") : `<div class="empty">No streamers yet - open the app to add some.</div>`;
  reportSize();
}

function reportSize() {
  requestAnimationFrame(() => {
    const h = $(".head").offsetHeight + $("#list").scrollHeight + $(".foot").offsetHeight + 2;
    api()?.flyout_size(340, Math.min(h, 700));
  });
}

window.onState = s => { state = s; applyTheme(s.theme); render(); $("#refreshBtn").classList.remove("spin"); };

$("#list").addEventListener("click", e => {
  const it = e.target.closest(".item");
  if (it) api().open_stream(it.dataset.p, it.dataset.n);
});
$("#openBtn").onclick = () => api().open_main("");
$("#settingsBtn").onclick = () => api().open_main("settings");
$("#refreshBtn").onclick = () => { $("#refreshBtn").classList.add("spin"); api().refresh(); };
$("#quitBtn").onclick = () => api().quit();
document.addEventListener("keydown", e => { if (e.key === "Escape") api().hide_flyout(); });

onApiReady(async () => {
  window.onState(await api().get_state());
  api().ready("flyout");
});
</script>
</body>
</html>
